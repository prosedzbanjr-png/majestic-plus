name: Phase 2 materialize and verify

on:
  push:
    branches:
      - staging/fivem-catalog-phase2-materialize

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit
        run: npm audit

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: materialize Phase 2 lockfile [phase2-lock]"
            git push
          fi
