<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Nighttime Vinewood skyline with a classic car">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081523"/>
      <stop offset="0.52" stop-color="#132130"/>
      <stop offset="1" stop-color="#060a0f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17202a"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25303c"/>
      <stop offset="0.4" stop-color="#10151d"/>
      <stop offset="1" stop-color="#030406"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18304a"/>
      <stop offset="1" stop-color="#05090d"/>
    </linearGradient>
    <radialGradient id="cityGlow">
      <stop offset="0" stop-color="#dca75c" stop-opacity=".38"/>
      <stop offset="1" stop-color="#dca75c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#9fb4c8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#9fb4c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wetRoad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131a" stop-opacity="0"/>
      <stop offset=".58" stop-color="#be792f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff5d37" stop-opacity=".03"/>
    </linearGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

