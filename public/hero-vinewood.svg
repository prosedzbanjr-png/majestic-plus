    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b29"/>
      <stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <radialGradient id="cityGlow">
      <stop offset="0" stop-color="#dca75c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#dca75c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

